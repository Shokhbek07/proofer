[project]
name = "proofer"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shokhbek Shukurulloev", email = "114989696+Shokhbek07@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
proofer = "proofer:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
baseline = [
    "semgrep>=1.179.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
finetune = [
    "mlx-lm>=0.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["bench/external", "bench/targets"]

[tool.uv]
# Semgrep is the outside baseline in the evaluation, so it is installed by default.
default-groups = ["dev", "baseline"]
