# Real security fixes from open-source web projects, scored as vulnerable and fixed pairs.
# Nothing is vendored. Fetch the trees with scripts/fetch_realworld.py: for each item it
# checks out the fix commit and its parent, and records the lines the fix changed.
#
# Why these: the bakery and DVWA are small and DVWA is old enough to be in any model's
# training data. These weaknesses were published after the Gemma 4 release (2 April 2026),
# in real code with real surrounding structure, so the default model cannot have seen
# the advisory or the fix.
#
# Selection, made on 2026-10-03 before any model was run on these items:
#
# 1. Mechanical (scripts/select_realworld.py, cache in data/cache/realworld-selection):
#    reviewed GitHub advisories, not withdrawn, published 2026-04-03 to 2026-09-30,
#    PIP or NPM ecosystem, a CWE in the injection or missing-check sets of that script,
#    exactly one cited GitHub fix commit with one parent, 1 to 3 non-test source files
#    changed, at least one of them modified, at most 80 changed source lines.
#    14,698 advisories, 881 in scope, 167 injection and 51 missing-check candidates
#    after keeping one advisory per repository, in a random order seeded with 20261003.
# 2. Manual, in that order, taking the first 12 of each group that pass:
#    the project is a web application or service, a web framework or HTTP middleware,
#    or a library whose purpose is handling web input or output (HTML sanitisers,
#    markdown to HTML, JWT or session handling, SSRF guards). Excluded: command line
#    tools, developer tooling, ML and data libraries, file-format parsers, browser
#    extensions, test utilities, general utility libraries.
# 3. Length: every reviewed file has at most 1,200 lines in the vulnerable version,
#    so a file needs at most four review windows.
#
# Excluded on the way, by position in the seeded order:
#   injection 1   GHSA-cmxg-94mg-jq94 @tmlmobilidade/utils    general utility library
#   injection 3   GHSA-fxgq-9m89-cxj9 eml_parser              file-format parser
#   injection 5   GHSA-wjv6-jcfj-mf9r datamodel-code-generator code generator (developer tooling)
#   injection 6   GHSA-29h4-r29x-hchv amazon-redshift driver  database driver, not web
#   injection 7   GHSA-6p8h-3wgx-97gf GitPython               git library, not web
#   injection 8   GHSA-w48f-fwg7-ww6p @stablelib/cbor         file-format parser
#   injection 11  GHSA-3hhw-38pf-pxj6 NLTK                    ML and data library
#   injection 16  GHSA-9qhq-v63v-fv3j PraisonAI               command line tool
#   injection 19  GHSA-322x-v876-g883 nogginlessdom           test utility
#   injection 21  GHSA-29pf-2h5f-8g72 transformers            ML library
#   injection 22  GHSA-mwp4-54f8-5fhr ip-address              general utility library
#   injection 23  GHSA-2j2x-hqr9-3h42 react-router            length: router.ts has 6,031 lines
#   missing 1     GHSA-pc2w-4mq8-32qw dynatrace-mcp           AI tool server; the check is a human-approval gate
#   missing 3     GHSA-jxc9-xmc4-gr23 open-webui              length: knowledge.py has 2,349 lines
#   missing 6     GHSA-g2hm-779g-vm32 openclaw                length: heartbeat-runner.ts has 1,488 lines
#   missing 8     GHSA-vc9j-9wph-qghj mppx                    crypto payments library, not web
#   missing 11    GHSA-vgxm-h9gx-h9w7 django-cms              length: placeholderadmin.py has 1,216 lines
#   missing 13    GHSA-f5vj-f2hx-8m93 webpack-dev-server      developer tooling
#   missing 14    GHSA-f5pf-q7c7-m3vv cyberdrop-dl            command line tool
#   missing 15    GHSA-5ffh-6f9q-5hhr Unleash                 length: feature-toggle-service.ts has 2,581 lines
#   missing 16    GHSA-hg6j-4rv6-33pg aiohttp                 length: client.py has 1,807 lines
#
# `files` are the fix commit's modified non-test source files, exactly as the mechanical
# filter found them, with no file dropped by hand. Each item was read before any model
# run: in every item at least one of them holds the weakness. Files that carry only a
# supporting edit are named in `note`; they stay, which makes `detected` slightly easier
# and `pair_correct` slightly harder. Only `files` are reviewed, but the whole
# repository is present for the project map. Changed lines are counted ignoring
# whitespace-only edits.
#
# `cwe` is the advisory's CWEs plus their family, so a finding is not missed over a
# sibling label. Families: path 22 23 24 35 36 59 73; xss 79 80 83 87 116;
# prototype 1321 915 471; ssrf 918 441; code 94 95 96 1336; validation 20 1284 1287;
# access 284 285 639 862 863 732 269 266 425 287 288 290 306 1390, plus 200 because
# missing authorisation shows up as disclosure; authenticity 345 346 347 352 1385.
# CWE-200 adds no family of its own. Other advisory CWEs (369, 524, 1389) are kept
# as they are.
#
# Scoring (src/proofer/realworld.py): detected = a finding of the item's class in one
# of its files on the vulnerable side; detected_at_change = one of its quoted ranges is
# within 3 lines of a line the fix changed; pair_correct = detected, and no finding of
# the class in those files on the fixed side.

target: realworld

